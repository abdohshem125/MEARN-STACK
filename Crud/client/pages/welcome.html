<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    body {
      margin: 20px;
    }

    .clients-container {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .client-card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      background: #f9f9f9;
    }

    .client-card h4 {
      /* margin: 0 0 10px; */
      color: #333;
    }

    .client-card p {
      margin: 5px 0;
      font-size: 14px;
      color: #555;
    }

    .client-card button.update {
      margin-top: 10px;
      padding: 6px 10px;
      border: none;
      background: #007bff !important;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
    }

    .client-card button.delete {
      margin-top: 10px;
      padding: 6px 10px;
      border: none;
      background: red !important;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
    }

    .client-card button:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>
  <h2>Welcome {name}</h2>
  <p>Your data is</p>
  <p>Name: {name}</p>
  <p>Mobile: {mobile}</p>
  <p>Email: {email}</p>
  <p>Address: {addr}</p>

  <button onclick="showClients()">Show clients</button>
  <div id="clients" class="clients-container"></div>

  <script>
    async function showClients() {
      try {
        let res = await fetch("/clients");
        let data = await res.json();

        let div = document.getElementById("clients");
        div.innerHTML = "";

        if (data.length === 0) {
          div.innerHTML = "<p>No clients</p>";
          return;
        }

        data.forEach((c) => {
          let card = `
        <div class="client-card">
              <p><b>Name:</b> ${c.name}</p>
              <p><b>Mobile:</b> ${c.mobile}</p>
              <p><b>Email:</b> ${c.email}</p>
              <p><b>Address:</b> ${c.addr}</p>
              <button onclick="updateClient('${c.email}', '${c.name}', '${c.mobile}', '${c.addr}')" class="update" >Update</button>
              <button onclick="deleteClient()" class ="delete" >Delete Client</button>
            </div>
          `;
          div.innerHTML += card;
        });
      } catch (err) {
        console.error("Error fetching clients:", err);
      }
    }


    async function updateClient() {
      let id = prompt("Enter client ID to update:");
      let email = prompt("Enter new email:");
      let name = prompt("Enter new name:");
      let mobile = prompt("Enter new mobile:");
      let addr = prompt("Enter new address:");

      try {
        let res = await fetch(`/update/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, name, mobile, Address })
        });

        let result = await res.json();
        alert(result.message);
        console.log(result.client);
      } catch (err) {
        console.error("Error updating client:", err);
      }
    }


    async function deleteClient() {
      let id = prompt("Enter client ID :");
      if (!id) return;

      try {
        let res = await fetch(`/delete/${id}`, {
          method: "DELETE"
        });

        let result = await res.json();
        alert(result.message);
        console.log("Deleted:", result.client);
      } catch (err) {
        console.error("Error deleting client:", err);
      }
    }
  </script>
</body>

</html>
